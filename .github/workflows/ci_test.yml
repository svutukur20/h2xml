name: CI only after 2 approvals
 
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted]
 
jobs:
  check-approvals:
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.check.outputs.approved }}
    steps:
      - uses: actions/github-script@v7
        id: check
        with:
          script: |
            const reviews = await github.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
 
            const approvals = reviews.data.filter(
              r => r.state === "APPROVED"
            ).length;
 
            core.setOutput("approved", approvals >= 2);
 
  build:
    needs: check-approvals
    if: needs.check-approvals.outputs.approved == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Running because 2 approvals are present"